# https://github.com/mbj/mutant/blob/master/docs/configuration.md

usage: opensource
requires:
  - rails_event_store
includes:
  - lib
integration:
  name: rspec
mutation:
  operators: light
coverage_criteria:
  process_abort: true
matcher:
  subjects:
    - RailsEventStore*
  ignore:
    - RailsEventStore::Client#initialize
    - RailsEventStore::JSONClient#default_mapper
    - RailsEventStore::JSONClient#preserve_types
    - RailsEventStore::AsyncHandler.with
