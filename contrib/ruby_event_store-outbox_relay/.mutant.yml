# https://github.com/mbj/mutant/blob/master/docs/configuration.md

usage: opensource
requires:
  - ruby_event_store/outbox_relay
includes:
  - lib
integration:
  name: rspec
mutation:
  operators: light
  timeout: 10.0
coverage_criteria:
  timeout: true
  process_abort: true
matcher:
  subjects:
    - RubyEventStore::OutboxRelay*
  ignore:
    - RubyEventStore::OutboxRelay::Relay#install_signal_handlers
    - RubyEventStore::OutboxRelay::Relay#lock_clause
    - RubyEventStore::OutboxRelay::Relay#process_batch
    - RubyEventStore::OutboxRelay::Relay#process_batch_safely
    - RubyEventStore::OutboxRelay::Relay#to_record
    - RubyEventStore::OutboxRelay::Relay#initialize
    # Its only two remaining mutations are genuinely equivalent: defined?(@ivar)
    # vs instance_variable_defined?(:@ivar) behave identically here, and
    # `defined?` checks assignment, not truthiness, so @x = true vs @x = false
    # for the reentrancy flag are indistinguishable too. See
    # spec/client_extension_spec.rb's "RailsEventStore::Client" examples for
    # the behavior this method actually needs to get right.
    - RubyEventStore::OutboxRelay::ClientExtension::InstanceMethods#initialize
